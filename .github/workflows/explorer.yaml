name: Explore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cuda-arch-11x:
    name: CUDA 11.x
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_version:
          - "11.0.3"
          - "11.1.1"
          - "11.4.3"
          - "11.5.2"
          - "11.7.1"
          - "11.8.0"
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          docker system prune -af
      - name: Pull CUDA docker image ${{ matrix.cuda_version }}
        run: docker pull nvidia/cuda:${{ matrix.cuda_version }}-devel-ubuntu20.04
      - name: Save listed architectures or CUDA 11.0 allowed help values
        run: |
          docker run --rm \
            -v "$(pwd)":/io \
            nvidia/cuda:${{ matrix.cuda_version }}-devel-ubuntu20.04 \
            bash -c '
              OUT="/io/tools/nvcc-arch-cuda-${{ matrix.cuda_version }}.txt"
              # Ensure directory exists
              mkdir -p /io/tools
              if ! command -v nvcc >/dev/null 2>&1; then
                echo "nvcc not found" > "$OUT"
                exit 0
              fi
              # Check if nvcc supports --list-gpu-arch
              if nvcc --help 2>&1 | grep -q -- "--list-gpu-arch"; then
                nvcc --list-gpu-arch > "$OUT" 2>&1
              else
                echo "Parsed from nvcc --help allowed values:" > "$OUT"
                nvcc --help | awk "
                  /^--gpu-architecture / { section = 1; next }
                  section && /^--/ { exit }
                  section && /Allowed values for this option:/ { allowed = 1 }
                  section && allowed { print }
                " | grep -o "sm_[0-9]\+" | sort -u | tr "\n" " " >> "$OUT"
                echo >> "$OUT"
              fi
            '
          cat tools/nvcc-arch-cuda-${{ matrix.cuda_version }}.txt
      - name: Verify compiler targets and extract checkout info
        run: |
          docker run --rm \
            -v "$(pwd)":/io \
            nvidia/cuda:${{ matrix.cuda_version }}-devel-ubuntu20.04 \
            bash -c "\
              apt-get update && apt-get install -y python3 && \
              cd /io/tools && \
              python3 probe_cuda_targets.py --output-dir nvcc-probe-cuda-${{ matrix.cuda_version }} && \
              PYTHONPATH=/io python3 extract_cuda_arch_info.py
            "
          ls tools/info-cuda-*.json
      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: info-${{ matrix.cuda_version }}
          if-no-files-found: error
          path: |
            tools/nvcc-arch-cuda-*.txt
            tools/info-cuda-*.json
            tools/nvcc-probe-cuda-*/

  cuda-arch-12x:
    name: CUDA 12.x
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda_version:
